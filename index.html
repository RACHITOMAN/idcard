<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ID Tool FINAL WORKING</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f4f4;
}

/* LAYOUT */
.container {
  display: flex;
  gap: 20px;
  padding: 20px;
}

/* DROP AREA */
.dropzone {
  border: 3px dashed #999;
  padding: 40px;
  background: white;
  text-align: center;
  margin-bottom: 15px;
  font-size: 16px;
  transition: background 0.2s, border-color 0.2s;
}

.dropzone.dragover {
  background: #e6f0ff;
  border-color: #007bff;
}

/* WORKSPACE */
.workspace {
  width: 1100px;
  min-height: 700px;
  background: white;
  border: 2px solid #333;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  padding: 15px;
}

/* CARD = single cropped ID image */
.card {
  width: 400px;
  height: 252px; /* 85mm x 54mm ratio */
  border: 2px solid #007bff;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  font-size: 14px;
}

/* MODAL */
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#cropImage {
  max-width: 90%;
  max-height: 70%;
}

#cropControls {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
  justify-content: center;
}

#cropControls button {
  width: auto;
  padding: 10px 16px;
  margin: 0;
}

#applyBtn {
  padding: 12px 25px;
}

/* PRINT FIX (CRITICAL) */
@media print {

  body {
    background: white !important;
  }

  body > h2, .sidebar, .dropzone {
    display: none !important;
  }

  .container {
    display: block;
  }

  .workspace {
    border: none !important;
    width: 100% !important;
    display: flex !important;
    flex-wrap: wrap;
    gap: 2mm;
    padding: 0 !important;
    justify-content: flex-start;
  }

  /* Vertical layout: 1 column, stacked tightly */
  .workspace.layout-vertical {
    flex-direction: column;
  }

  .card {
    border: none !important;
    width: 95mm !important;
    height: 60mm !important;
    page-break-inside: avoid;
    margin: 0;
  }

  @page {
    size: A4;
    margin: 5mm;
  }
}
</style>
</head>

<body>

<h2 style="padding-left:20px;">🔥 ID Tool FINAL WORKING</h2>

<div class="container">

  <div>

    <div class="dropzone">
      📂 Choose or Drop Images
      <br><br>
      <input type="file" id="fileInput" multiple>
    </div>

    <div class="workspace layout-horizontal" id="workspace"></div>

  </div>

  <div class="sidebar">
    <label for="layoutSelect"><strong>PDF Layout</strong></label>
    <select id="layoutSelect">
      <option value="layout-horizontal">Side by side (2 per row)</option>
      <option value="layout-vertical">Vertical (stacked)</option>
    </select>
    <button onclick="window.print()">📄 Export PDF</button>
  </div>

</div>

<!-- CROPPER -->
<div id="modal">
  <img id="cropImage">

  <div id="cropControls">
    <button onclick="setAspect(1.586)">📇 ID Ratio</button>
    <button onclick="setAspect(NaN)">✋ Free Crop</button>
    <button onclick="zoomCrop(0.1)">🔍 Zoom In</button>
    <button onclick="zoomCrop(-0.1)">🔎 Zoom Out</button>
    <button onclick="rotateCrop(-90)">⟲ Rotate Left</button>
    <button onclick="rotateCrop(90)">⟳ Rotate Right</button>
    <button onclick="resetCrop()">↺ Reset</button>
  </div>

  <button id="applyBtn">✔ Crop & Apply</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>

<script>

const workspace = document.getElementById("workspace");
const fileInput = document.getElementById("fileInput");
const modal = document.getElementById("modal");
const cropImage = document.getElementById("cropImage");
const layoutSelect = document.getElementById("layoutSelect");
const dropzone = document.querySelector(".dropzone");

let cropper = null;
let currentSlot = null;

/* DRAG & DROP HANDLING (prevents browser opening the file) */
["dragenter", "dragover"].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.add("dragover");
  });
});

["dragleave", "dragend"].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove("dragover");
  });
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  e.stopPropagation();
  dropzone.classList.remove("dragover");

  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));

  for (let i = 0; i < files.length; i++) {
    workspace.appendChild(createCard(files[i]));
  }
});

/* Also catch drops anywhere on the page so the browser never navigates away */
["dragover", "drop"].forEach(evt => {
  window.addEventListener(evt, e => {
    e.preventDefault();
  });
});

/* LAYOUT SWITCH */
layoutSelect.addEventListener("change", () => {
  workspace.classList.remove("layout-horizontal", "layout-vertical");
  workspace.classList.add(layoutSelect.value);
});

/* FILE INPUT - one card per image */
fileInput.addEventListener("change", e => {
  const files = [...e.target.files];

  for (let i = 0; i < files.length; i++) {
    workspace.appendChild(createCard(files[i]));
  }
});

/* CREATE CARD - single slot per card */
function createCard(file) {

  const card = document.createElement("div");
  card.className = "card";

  card.onclick = () => openCrop(file, card);

  loadImage(file, card);

  return card;
}

/* LOAD IMAGE */
function loadImage(file, slot) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    const img = document.createElement("img");
    img.src = e.target.result;

    slot.innerHTML = "";
    slot.appendChild(img);
  };

  reader.readAsDataURL(file);
}

/* OPEN CROPPER */
function openCrop(file, slot) {

  if (!file) return;

  currentSlot = slot;

  const reader = new FileReader();

  reader.onload = e => {

    cropImage.src = e.target.result;
    modal.style.display = "flex";

    cropImage.onload = () => {

      if (cropper) cropper.destroy();

      cropper = new Cropper(cropImage, {
        aspectRatio: 1.586,
        viewMode: 1,
        autoCropArea: 1,
        dragMode: "move",
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: true
      });
    };
  };

  reader.readAsDataURL(file);
}

/* MANUAL CROP CONTROLS */
function setAspect(ratio) {
  if (cropper) cropper.setAspectRatio(ratio);
}

function zoomCrop(amount) {
  if (cropper) cropper.zoom(amount);
}

function rotateCrop(deg) {
  if (cropper) cropper.rotate(deg);
}

function resetCrop() {
  if (cropper) cropper.reset();
}

/* APPLY CROPPED IMAGE */
document.getElementById("applyBtn").onclick = function () {

  const canvas = cropper.getCroppedCanvas({
    width: 800
  });

  const img = document.createElement("img");
  img.src = canvas.toDataURL("image/png");

  currentSlot.innerHTML = "";
  currentSlot.appendChild(img);

  cropper.destroy();
  cropper = null;
  modal.style.display = "none";
};

</script>

</body>
</html>
